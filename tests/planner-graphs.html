<!doctype html><html><head><meta charset="utf-8"><style>
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;margin:8px 0;color:var(--muted-foreground)}
.plots{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px;margin-top:20px}
.plot-title{font-size:13px;font-weight:500;margin:0 0 4px}.plot-title span{font-weight:400;color:var(--muted-foreground);font-size:11px}
svg{display:block;width:100%;overflow:visible}svg text{font:11px var(--font-sans);fill:var(--muted-foreground);font-variant-numeric:tabular-nums}
.point{cursor:pointer}.point:focus{outline:2px solid var(--link);outline-offset:3px}.point .ring{opacity:0}.point:focus .ring{opacity:1}
@media(hover:hover){.point:hover .ring{opacity:1}}
#detail{margin-top:12px;font-size:12px;min-height:40px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
#caption{margin-top:20px}
select{font:12px var(--font-sans);color:var(--foreground);background:var(--background);border:1px solid var(--border);padding:4px;max-width:100%}
@media(max-width:480px){.plots{grid-template-columns:1fr;gap:20px}.legend{gap:4px 12px}}
</style></head><body>
<div class="ui-header"><p class="ui-title" id="title"></p><p class="ui-sub" id="subtitle"></p></div>
<div class="legend"><span style="color:var(--chart-4)">Opus high</span><span style="color:var(--chart-1)">Opus low</span><span style="color:var(--chart-2)">Sonnet medium</span><span style="color:var(--chart-3)">Haiku medium</span></div>
<div class="legend" id="marks"></div>
<label class="ui-label">Inspect run <select id="run"><option value="">Select any run</option></select></label>
<div class="plots" id="plots"></div>
<p class="ui-caption" id="caption"></p>
<div id="detail" aria-live="polite">Select a point or run for exact measurements.</div>
<script>
{
 const data=__DATA__, metric=__METRIC__, costMode=metric==='api-cost';
 const cases=['Rails','Sidekiq','Pagy','Faraday'],models=['Opus high','Opus low','Sonnet medium','Haiku medium'];
 const colors=['var(--chart-4)','var(--chart-1)','var(--chart-2)','var(--chart-3)'];
 const host=document.getElementById('plots'),detail=document.getElementById('detail'),picker=document.getElementById('run');
 document.getElementById('title').textContent=costMode?'Accuracy versus API price':'Accuracy versus response time';
 document.getElementById('subtitle').textContent=`${data.length} runs · five repetitions per case and configuration · October 12–13, 2026`;
 document.getElementById('marks').textContent=costMode?'● Recorded usage complete   △ Lower bound only   × Usage unavailable':'● Full plan delivered   × Missing / incomplete / implementation   ○ Delivery unverified';
 document.getElementById('caption').textContent='Accuracy = actionable findings / expected findings. Safety and validation scored separately. No plan = N/A, not 0%. '+(costMode?'October 13 API list prices for recorded main + subagent requests; not invoices. Excludes unlogged calls and billing adjustments. Log price scale.':'Log time scale. Rails/Sidekiq Opus-high are earlier development references.')+' Overlapping runs remain individually selectable.';
 const fmt=ms=>`${Math.floor(Math.round(ms/1000)/60)}m ${String(Math.round(ms/1000)%60).padStart(2,'0')}s`;
 const money=n=>n===null?'unavailable':`$${n.toFixed(4)}`;
 const node=(tag,attrs,text)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;return n};
 const describe=d=>`${models[d[1]]} · ${cases[d[0]]} run ${d[2]} · accuracy ${d[3]===null?'N/A (no plan)':`${(100*d[3]/(d[0]===0?23:2)).toFixed(1)}% (${d[3]}/${d[0]===0?23:2} findings)`} · response ${fmt(d[4])} · recorded-request cost ${d[6]===null&&d[7]!==null?'≥ ':''}${money(d[6]??d[7])}`;
 const show=d=>{const k=d[8];detail.textContent=describe(d)+`. Tokens: input ${k.input_tokens??'N/A'}, known output ${k.known_output_tokens??'N/A'}, cache read ${k.cache_read_input_tokens??'N/A'}, cache write ${k.cache_creation_input_tokens??'N/A'}. ${d[6]===null?'Incomplete usage is not a full cost.':'Recorded requests only; unlogged charges excluded.'}`;for(const ring of document.querySelectorAll('.ring'))ring.style.opacity='';const g=document.querySelector(`[data-run="${d[0]}-${d[1]}-${d[2]}"]`);if(g){g.parentElement.append(g);g.querySelector('.ring').style.opacity='1'}};
 data.forEach((d,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${cases[d[0]]} · ${models[d[1]]} · run ${d[2]}`;picker.append(o)});
 picker.addEventListener('change',()=>{if(picker.value!=='')show(data[Number(picker.value)])});
 for(let c=0;c<4;c++){
  const section=document.createElement('section');section.innerHTML=`<p class="plot-title">${cases[c]} <span>${c===0?23:2} expected findings${costMode?' · USD':''}</span></p>`;
  const svg=node('svg',{'aria-label':`${cases[c]} per-run ${costMode?'accuracy versus price':'accuracy versus response time'}`,role:'group'});section.append(svg);host.append(section);
  const draw=()=>{
   const w=svg.getBoundingClientRect().width,h=174,L=costMode?80:40,R=w-12,T=costMode?32:18,B=124;
   svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.replaceChildren();
   const x=v=>costMode?L+(R-L)*Math.log(Math.max(.001,v)/.001)/Math.log(20000):L+(R-L)*Math.log(Math.max(.5,v/60000)/.5)/Math.log(128);
   const y=a=>B-(B-T)*a/100;
   for(const a of [0,50,100]){svg.append(node('line',{x1:L,x2:R,y1:y(a),y2:y(a),stroke:a===0?'var(--border)':'var(--grid)'}));svg.append(node('text',{x:0,y:y(a)-4},`${a}%`))}
   for(const tick of costMode?[.001,.01,.1,1,10]:[1,4,16,64])svg.append(node('text',{x:x(costMode?tick:tick*60000),y:B+16,'text-anchor':tick===(costMode?10:64)?'end':'middle'},costMode?`$${tick}`:String(tick)));
   svg.append(node('text',{x:0,y:B+30},'N/A'));
   if(costMode){svg.append(node('text',{x:44,y:B+16,'text-anchor':'middle'},'N/A'));svg.append(node('text',{x:0,y:14},'Accuracy'))}
   svg.append(node('text',{x:L,y:172},costMode?'API price (USD, log scale)':'Response time (min, log scale)'));
   const points=data.filter(row=>row[0]===c);
   if(costMode)points.sort((a,b)=>Number(a[6]===null&&a[7]!==null)-Number(b[6]===null&&b[7]!==null));
   for(const d of points){
    const [ci,m,r,a,t,f,estimate,bound]=d,accuracy=a===null?null:100*a/(c===0?23:2),price=estimate??bound;
    const px=costMode?(price===null?44:x(price)):x(t),py=accuracy===null?B+26:y(accuracy),mark=costMode?(estimate!==null?'F':bound!==null?'B':'X'):f;
    const g=node('g',{class:'point',tabindex:0,role:'button','data-run':`${ci}-${m}-${r}`,'aria-label':describe(d)});
    g.append(node('title',{},describe(d)));g.append(node('circle',{class:'ring',cx:px,cy:py,r:8,fill:'none',stroke:colors[m],'stroke-width':1}));
    if(mark==='X')g.append(node('path',{d:`M${px-4},${py-4}l8,8m-8,0l8,-8`,stroke:colors[m],'stroke-width':1.8,fill:'none'}));
    else if(mark==='B')g.append(node('path',{d:`M${px},${py-5}l5,9h-10z`,stroke:colors[m],'stroke-width':1.5,fill:'var(--background)'}));
    else g.append(node('circle',{cx:px,cy:py,r:4.5,fill:mark==='U'?'var(--background)':colors[m],stroke:colors[m],'stroke-width':1.5}));
    g.addEventListener('pointerover',()=>show(d));g.addEventListener('focus',()=>show(d));g.addEventListener('click',()=>show(d));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();show(d)}});svg.append(g);
   }
  };
  new ResizeObserver(draw).observe(svg);draw();
 }
}
</script></body></html>
